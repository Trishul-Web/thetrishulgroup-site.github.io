<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Link Card</title>
    <meta name="theme-color" id="themeColor" content="#EFF6FF">
    <meta name="color-scheme" content="light dark">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: linear-gradient(160deg, #EFF6FF, #FFFFFF);
            --card: #FFFFFF;
            --text: #111827;
            --sub: #6B7280;
            --btn: #FFFFFF;
            --btnText: #111827;
            --border: #E5E7EB;
            --accent: #2563EB;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 18px calc(30px + env(safe-area-inset-bottom));
        }

        .wrap {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            color: #fff;
            background: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
            border: 4px solid #fff;
            position: relative;
        }

        .avatar.small {
            width: 72px;
            height: 72px;
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .bio {
            color: var(--sub);
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
            word-break: break-word;
        }

        /* ICONS */
        .fav {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            object-fit: contain;
            display: block;
        }

        /* STACK (default) */
        .links {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 18px 13px 13px;
            border-radius: 16px;
            background: var(--btn);
            color: var(--btnText);
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
            transition: transform .15s;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }

        .btn:active,
        .tile:active,
        .chip:active,
        .ic:active,
        .mlink:active {
            transform: scale(.97);
        }

        .ico {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(127, 127, 127, .14);
            flex-shrink: 0;
        }

        .lbl {
            flex: 1;
            text-align: left;
            overflow: hidden;
        }

        .lbl small {
            display: block;
            font-size: 11px;
            font-weight: 600;
            opacity: .6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow {
            opacity: .5;
            font-size: 13px;
        }

        /* PILL */
        .pill {
            justify-content: center;
            border-radius: 999px;
            padding: 11px 18px;
        }

        .pill .ico {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
        }

        .pill .lbl {
            flex: none;
            text-align: center;
        }

        /* GLASS */
        .glassb {
            background: rgba(255, 255, 255, .16) !important;
            color: var(--text) !important;
            border: 1px solid rgba(255, 255, 255, .35) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: none !important;
        }

        .glassb .ico {
            background: rgba(255, 255, 255, .9) !important;
        }

        /* NEON */
        body.neon {
            background: linear-gradient(160deg, #05070F, #111827) !important;
            color: #fff;
        }

        body.neon .bio,
        body.neon .footer a {
            color: #94A3B8;
        }

        body.neon .avatar {
            border-color: var(--accent);
            box-shadow: 0 0 26px var(--accent);
        }

        .neonb {
            background: transparent !important;
            color: var(--accent) !important;
            border: 1.5px solid var(--accent) !important;
            box-shadow: 0 0 14px var(--accent) !important;
        }

        .neonb .ico {
            background: rgba(255, 255, 255, .08) !important;
        }

        /* RETRO */
        .retrob {
            background: #fff !important;
            color: #111 !important;
            border: 2.5px solid #111 !important;
            border-radius: 6px !important;
            box-shadow: 5px 5px 0 #111 !important;
        }

        .retrob .ico {
            border-radius: 4px;
            border: 2px solid #111;
        }

        /* MINIMAL */
        .mlinks {
            margin-top: 26px;
            display: flex;
            flex-direction: column;
        }

        .mlink {
            padding: 15px 4px;
            border-bottom: 1px solid rgba(127, 127, 127, .3);
            color: var(--text);
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            text-align: left;
            transition: transform .15s;
        }

        .mlink .ml {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .mlink .ml i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .mlink small {
            font-weight: 600;
            font-size: 12px;
            color: var(--sub);
            max-width: 45%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* GRID + BENTO */
        .grid {
            margin-top: 26px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tile {
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 18px 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
            text-align: center;
            word-break: break-word;
            min-height: 108px;
            transition: transform .15s;
        }

        .tile .big {
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile .big .fav {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        .tile.hero {
            grid-column: 1 / -1;
            background: var(--accent);
            color: #fff;
            border: none;
            flex-direction: row;
            font-size: 17px;
            min-height: 76px;
        }

        .tile.hero .big {
            font-size: 26px;
        }

        /* COVER */
        .coverband {
            height: 130px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), rgba(0, 0, 0, .25));
            margin-bottom: -52px;
        }

        /* ICON BUBBLES (app-icon look) */
        .icons {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px 14px;
        }

        .ic {
            width: 76px;
            text-decoration: none;
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            word-break: break-word;
            transition: transform .15s;
        }

        .ic .c {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: var(--btn);
            color: var(--btnText);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
        }

        .ic .c .fav {
            width: 34px;
            height: 34px;
            border-radius: 8px;
        }

        /* BUSINESS CARD */
        .biz {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 12px 34px rgba(0, 0, 0, .14);
        }

        .biz .avatar {
            width: 68px;
            height: 68px;
            font-size: 28px;
            margin: 0;
            flex-shrink: 0;
        }

        .biz h1 {
            font-size: 20px;
        }

        .biz .bio {
            color: inherit;
            opacity: .7;
        }

        .chips {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .chip {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 11px 16px;
            border-radius: 999px;
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
            transition: transform .15s;
        }

        .chip i {
            font-size: 16px;
        }

        .chip .fav {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .save {
            margin-top: 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            justify-content: center;
            gap: 10px;
            padding: 15px 18px;
        }

        .footer {
            margin-top: 34px;
            font-size: 12px;
            font-weight: 700;
        }

        .footer a {
            color: var(--sub);
            text-decoration: none;
        }

        .err {
            margin-top: 30vh;
            color: var(--sub);
            font-weight: 700;
        }

        /* APP PROMO CARD (free users) */
        .promo {
            margin-top: 36px;
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            border-radius: 22px;
            padding: 20px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
            text-align: center;
        }

        .promo-top {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .promo-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .2);
            overflow: hidden;
        }

        .promo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .promo-top strong {
            display: block;
            font-size: 15px;
            font-weight: 800;
        }

        .promo-top small {
            display: block;
            font-size: 11px;
            font-weight: 700;
            opacity: .6;
            margin-top: 2px;
        }

        .promo p {
            font-size: 13px;
            font-weight: 600;
            opacity: .85;
            margin: 14px 0 12px;
            line-height: 1.45;
        }

        .promo-feats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .promo-feats span {
            font-size: 11px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(127, 127, 127, .14);
        }

        .promo-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #111827;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
            transition: transform .15s;
        }

        .promo-btn:active {
            transform: scale(.97);
        }

        .promo-btn i {
            font-size: 18px;
        }

        /* PREVIEW MODE */
        .pbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99;
            background: #F59E0B;
            color: #111;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            padding: 10px 12px;
            padding-top: calc(10px + env(safe-area-inset-top));
            box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
            letter-spacing: .3px;
        }

        body.preview {
            padding-top: 84px;
        }

        body.preview a,
        body.preview button {
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="wrap" id="app"></div>

    <script>
        var FOOTER_URL = "https://play.google.com/store/apps/details?id=com.devduo.qrcodegenerator&utm_source=linkbio_card&utm_medium=qr";
        var BAR_COLORS = { classic: "#EFF6FF", midnight: "#020617", sunset: "#F97316", ocean: "#0EA5E9", forest: "#10B981", royal: "#4C1D95" };
        var LAYOUTS = ["stack", "minimal", "grid", "cover", "pill", "glass", "bento", "neon", "retro", "iconbar", "card"];

        function setBarColor(c) {
            var m = document.getElementById("themeColor");
            if (m) m.setAttribute("content", c);
        }

        var THEMES = {
            classic: { bg: "linear-gradient(160deg,#EFF6FF,#FFFFFF)", card: "#FFFFFF", text: "#111827", sub: "#6B7280", btn: "#FFFFFF", btnText: "#111827", border: "#E5E7EB", accent: "#2563EB" },
            midnight: { bg: "linear-gradient(160deg,#020617,#0F172A)", card: "#0F172A", text: "#F8FAFC", sub: "#94A3B8", btn: "#1E293B", btnText: "#F8FAFC", border: "#334155", accent: "#38BDF8" },
            sunset: { bg: "linear-gradient(160deg,#F97316,#DB2777)", card: "#FFFFFF", text: "#FFFFFF", sub: "#FFE4E6", btn: "rgba(255,255,255,.95)", btnText: "#9D174D", border: "transparent", accent: "#BE185D" },
            ocean: { bg: "linear-gradient(160deg,#0EA5E9,#1E3A8A)", card: "#FFFFFF", text: "#FFFFFF", sub: "#DBEAFE", btn: "rgba(255,255,255,.95)", btnText: "#1E3A8A", border: "transparent", accent: "#1D4ED8" },
            forest: { bg: "linear-gradient(160deg,#10B981,#064E3B)", card: "#FFFFFF", text: "#FFFFFF", sub: "#D1FAE5", btn: "rgba(255,255,255,.95)", btnText: "#064E3B", border: "transparent", accent: "#047857" },
            royal: { bg: "linear-gradient(160deg,#4C1D95,#6D28D9)", card: "#FDE68A", text: "#FFFFFF", sub: "#DDD6FE", btn: "#1E1B4B", btnText: "#FDE68A", border: "#F59E0B", accent: "#F59E0B" }
        };

        // Real brand icons (Font Awesome) + brand colors. color:null = follows the theme text color.
        var TYPES = {
            instagram: { label: "Instagram", fa: "fa-brands fa-instagram", color: "#E1306C" },
            whatsapp: { label: "WhatsApp", fa: "fa-brands fa-whatsapp", color: "#25D366" },
            website: { label: "Website", fa: "fa-solid fa-globe", color: "#2563EB" },
            phone: { label: "Call", fa: "fa-solid fa-phone", color: "#0EA5E9" },
            email: { label: "Email", fa: "fa-solid fa-envelope", color: "#F43F5E" },
            upi: { label: "Pay via UPI", fa: "fa-solid fa-indian-rupee-sign", color: "#14B8A6" },
            youtube: { label: "YouTube", fa: "fa-brands fa-youtube", color: "#FF0000" },
            facebook: { label: "Facebook", fa: "fa-brands fa-facebook-f", color: "#1877F2" },
            linkedin: { label: "LinkedIn", fa: "fa-brands fa-linkedin-in", color: "#0A66C2" },
            x: { label: "X / Twitter", fa: "fa-brands fa-x-twitter", color: null },
            telegram: { label: "Telegram", fa: "fa-brands fa-telegram", color: "#229ED9" }
        };

        function decode(s) {
            s = s.replace(/-/g, "+").replace(/_/g, "/");
            while (s.length % 4) s += "=";
            var bin = atob(s);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return JSON.parse(new TextDecoder().decode(bytes));
        }

        function handle(v) { return v.replace(/^@/, "").replace(/^\/+|\/+$/g, "").replace(/\s+/g, ""); }
        function isHttp(v) { return /^https?:\/\//i.test(v); }
        function asUrl(v) { return isHttp(v) ? v : "https://" + v.replace(/^\/+/, ""); }

        // Accepts a username, @username, full link, or link without https://
        var DOMAINS = {
            instagram: /(^|\.|\/\/)(instagram\.com|instagr\.am)(\/|$)/i,
            youtube: /(^|\.|\/\/)(youtube\.com|youtu\.be)(\/|$)/i,
            facebook: /(^|\.|\/\/)(facebook\.com|fb\.com|fb\.me)(\/|$)/i,
            linkedin: /(^|\.|\/\/)(linkedin\.com|lnkd\.in)(\/|$)/i,
            x: /(^|\.|\/\/)(x\.com|twitter\.com)(\/|$)/i,
            telegram: /(^|\.|\/\/)(t\.me|telegram\.me)(\/|$)/i
        };

        function social(type, v, base) {
            if (isHttp(v)) return v;
            if (DOMAINS[type] && DOMAINS[type].test(v)) return asUrl(v);
            var h = handle(v);
            return h ? base + h : null;
        }

        function buildUrl(type, v, name) {
            v = String(v || "").trim();
            if (!v) return null;
            switch (type) {
                case "instagram": return social(type, v, "https://instagram.com/");
                case "youtube": return social(type, v, "https://youtube.com/@");
                case "facebook": return social(type, v, "https://facebook.com/");
                case "linkedin": return social(type, v, "https://linkedin.com/in/");
                case "x": return social(type, v, "https://x.com/");
                case "telegram": return social(type, v, "https://t.me/");
                case "whatsapp":
                    if (/wa\.me|whatsapp\.com/i.test(v)) return asUrl(v);
                    var digits = v.replace(/[^0-9]/g, "");
                    return digits ? "https://wa.me/" + digits : null;
                case "website": return asUrl(v);
                case "phone": return "tel:" + v.replace(/^tel:/i, "").replace(/[^0-9+]/g, "");
                case "email": return "mailto:" + v.replace(/^mailto:/i, "").trim();
                case "upi":
                    if (/^upi:\/\//i.test(v)) return v;
                    return "upi://pay?pa=" + encodeURIComponent(v) + "&pn=" + encodeURIComponent(name) + "&cu=INR";
                default: return isHttp(v) ? v : null;
            }
        }

        function safe(url) { return url && /^(https?:|tel:|mailto:|upi:)/i.test(url); }

        function applyTheme(t) {
            var th = THEMES[t] || THEMES.classic;
            var r = document.documentElement.style;
            Object.keys(th).forEach(function (k) { r.setProperty("--" + k, th[k]); });
            setBarColor(BAR_COLORS[t] || BAR_COLORS.classic);
        }

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }

        function link(url, cls) {
            var a = el("a", cls);
            a.href = url;
            if (/^https?:/i.test(url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
            return a;
        }

        function faIcon(cls, color) {
            var i = el("i", cls);
            if (color) i.style.color = color;
            return i;
        }

        // Real icon: website -> its own favicon, everything else -> brand logo
        function glyph(it, color) {
            if (it.type === "website" && it.host) {
                var img = el("img", "fav");
                img.alt = "";
                img.loading = "lazy";
                img.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(it.host) + "&sz=64";
                img.onerror = function () { img.replaceWith(faIcon(it.info.fa, color)); };
                return img;
            }
            return faIcon(it.info.fa, color);
        }

        function softIcon(it) {
            var s = el("span", "ico");
            if (it.info.color) s.style.background = it.info.color + "1F";
            s.appendChild(glyph(it, it.info.color));
            return s;
        }

        function saveContact(name, phone, email) {
            var vcf = "BEGIN:VCARD\nVERSION:3.0\nFN:" + name + (phone ? "\nTEL:" + phone : "") + (email ? "\nEMAIL:" + email : "") + "\nEND:VCARD";
            var blob = new Blob([vcf], { type: "text/vcard" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = (name || "contact").replace(/[^a-z0-9]/gi, "_") + ".vcf";
            document.body.appendChild(a); a.click(); a.remove();
        }

        function renderHeader(app, layout, name, bio) {
            var initial = name.trim().charAt(0).toUpperCase();
            if (layout === "card") {
                var biz = el("div", "biz");
                biz.appendChild(el("div", "avatar", initial));
                var col = el("div");
                col.appendChild(el("h1", null, name));
                if (bio) col.appendChild(el("p", "bio", bio));
                biz.appendChild(col);
                app.appendChild(biz);
                return;
            }
            if (layout === "cover") app.appendChild(el("div", "coverband"));
            app.appendChild(el("div", layout === "minimal" ? "avatar small" : "avatar", initial));
            app.appendChild(el("h1", null, name));
            if (bio) app.appendChild(el("p", "bio", bio));
        }

        function btn(it, extra, noSub) {
            var a = link(it.url, "btn" + (extra ? " " + extra : ""));
            a.appendChild(softIcon(it));
            var lbl = el("span", "lbl", it.label);
            if (!noSub) lbl.appendChild(el("small", null, it.val));
            a.appendChild(lbl);
            if (!noSub) a.appendChild(faIcon("fa-solid fa-chevron-right arrow"));
            return a;
        }

        function tile(it, hero) {
            var a = link(it.url, hero ? "tile hero" : "tile");
            var big = el("span", "big");
            big.appendChild(glyph(it, hero ? "#fff" : it.info.color));
            a.appendChild(big);
            a.appendChild(el("span", null, it.label));
            return a;
        }

        function renderLinks(app, layout, items) {
            var box;
            switch (layout) {
                case "minimal":
                    box = el("div", "mlinks");
                    items.forEach(function (it) {
                        var a = link(it.url, "mlink");
                        var ml = el("span", "ml");
                        ml.appendChild(glyph(it, it.info.color));
                        ml.appendChild(el("span", null, it.label));
                        a.appendChild(ml);
                        a.appendChild(el("small", null, it.val));
                        box.appendChild(a);
                    });
                    break;
                case "grid":
                    box = el("div", "grid");
                    items.forEach(function (it) { box.appendChild(tile(it, false)); });
                    break;
                case "bento":
                    box = el("div", "grid");
                    items.forEach(function (it, i) { box.appendChild(tile(it, i === 0)); });
                    break;
                case "iconbar":
                    box = el("div", "icons");
                    items.forEach(function (it) {
                        var a = link(it.url, "ic");
                        var c = el("span", "c");
                        var isFav = it.type === "website" && it.host;
                        if (isFav) c.style.background = "#FFFFFF";
                        else if (it.info.color) c.style.background = it.info.color;
                        c.appendChild(glyph(it, it.info.color ? "#FFFFFF" : null));
                        a.appendChild(c);
                        a.appendChild(el("span", null, it.label));
                        box.appendChild(a);
                    });
                    break;
                case "card":
                    box = el("div", "chips");
                    items.forEach(function (it) {
                        var a = link(it.url, "chip");
                        a.appendChild(glyph(it, it.info.color));
                        a.appendChild(el("span", null, it.label));
                        box.appendChild(a);
                    });
                    break;
                case "pill":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "pill", true)); });
                    break;
                case "glass":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "glassb")); });
                    break;
                case "neon":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "neonb")); });
                    break;
                case "retro":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "retrob")); });
                    break;
                default:
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it)); });
            }
            app.appendChild(box);
        }

        (function render() {
            var app = document.getElementById("app");
            try {
                var m = (location.hash || "").match(/d=([A-Za-z0-9\-_]+)/);
                if (!m) throw new Error("no data");
                var d = decode(m[1]);

                applyTheme(d.t);
                var layout = LAYOUTS.indexOf(d.y) >= 0 ? d.y : "stack";
                if (layout === "neon") {
                    document.body.classList.add("neon");
                    setBarColor("#05070F");
                }

                if (d.p === 1) {
                    // PREVIEW MODE: always ignore any data in the URL and show fixed sample details
                    d.n = "Priya Sharma Designs";
                    d.b = "Handmade jewellery • Pune";
                    d.l = [
                        ["whatsapp", "919876543210", "Order on WhatsApp"],
                        ["phone", "+91 98765 43210", "Call Me"],
                        ["instagram", "priya.designs"],
                        ["website", "google.com", "My Portfolio"],
                        ["upi", "priya@okicici", "Pay via UPI"],
                        ["email", "hello@priyadesigns.in", "Email Me"],
                        ["youtube", "priyadesigns", "Watch My Tutorials"],
                        ["facebook", "priyadesigns"],
                        ["linkedin", "priya-sharma"],
                        ["x", "priyadesigns"],
                        ["telegram", "priyadesigns"]
                    ];
                    document.body.classList.add("preview");
                    document.body.appendChild(el("div", "pbar", "👀 DESIGN PREVIEW · Sample details · Links disabled"));
                    setBarColor("#F59E0B");
                }

                var name = String(d.n || "My Links").slice(0, 40);
                var bio = d.b ? String(d.b).slice(0, 60) : "";
                document.title = name;

                renderHeader(app, layout, name, bio);

                var items = [];
                var phone = "", email = "";
                (d.l || []).slice(0, d.p === 1 ? 12 : 8).forEach(function (pair) {
                    var type = pair[0], val = String(pair[1] || "");
                    if (type === "phone" || (type === "whatsapp" && !phone && !/wa\.me|whatsapp/i.test(val))) phone = val;
                    if (type === "email") email = val;
                    var url = buildUrl(type, val, name);
                    if (!safe(url)) return;
                    var info = TYPES[type] || TYPES.website;
                    var customTitle = pair[2] ? String(pair[2]).trim().slice(0, 30) : "";
                    var host = "";
                    if (type === "website") {
                        try { host = new URL(url).hostname; } catch (e) { host = ""; }
                    }
                    items.push({ url: url, type: TYPES[type] ? type : "website", info: info, label: customTitle || info.label, val: val, host: host });
                });

                renderLinks(app, layout, items);

                if (phone || email) {
                    var sb = el("button", "btn save");
                    sb.appendChild(faIcon("fa-solid fa-address-book"));
                    sb.appendChild(el("span", null, "Save Contact"));
                    sb.onclick = function () { saveContact(name, phone, email); };
                    app.appendChild(sb);
                }

                if (d.f === 2) {
                    // PRO user who chose to keep the small credit line
                    var f = el("div", "footer");
                    var fa = el("a", null, "⚡ Made with Custom QR");
                    fa.href = FOOTER_URL; fa.target = "_blank"; fa.rel = "noopener";
                    f.appendChild(fa);
                    app.appendChild(f);
                } else if (d.f !== 0) {
                    // FREE users (and old cards): full promotion card
                    var promo = el("div", "promo");
                    var top = el("div", "promo-top");
                    var pi = el("div", "promo-icon");
                    var appIcon = el("img");
                    appIcon.alt = "Custom QR";
                    appIcon.src = "https://play-lh.googleusercontent.com/SRu8BZtULcUm_d3wI5TJennrBnad1iaFk0WoLvSFsGKljHv1K4E70URcM6O01uGtUv7vRl9-xXWAL7Nbo3Mq=s512-rw";
                    appIcon.onerror = function () { appIcon.replaceWith(faIcon("fa-solid fa-qrcode")); };
                    pi.appendChild(appIcon);
                    top.appendChild(pi);
                    var tt = el("div");
                    tt.appendChild(el("strong", null, "Custom QR"));
                    tt.appendChild(el("small", null, "All Links in One QR • Free app • Android"));
                    top.appendChild(tt);
                    promo.appendChild(top);
                    promo.appendChild(el("p", null, "Want a card like this? Create your own links page in one QR in 60 seconds. All your socials, WhatsApp & payments in one scan."));
                    var feats = el("div", "promo-feats");
                    ["✔ Free", "✔ No account", "✔ Never expires"].forEach(function (t) { feats.appendChild(el("span", null, t)); });
                    promo.appendChild(feats);
                    var pb = el("a", "promo-btn");
                    pb.href = FOOTER_URL; pb.target = "_blank"; pb.rel = "noopener";
                    pb.appendChild(faIcon("fa-brands fa-google-play"));
                    pb.appendChild(el("span", null, "Get it on Google Play"));
                    promo.appendChild(pb);
                    app.appendChild(promo);
                }
            } catch (e) {
                app.appendChild(el("p", "err", "This card link is invalid or incomplete."));
            }
        })();
    </script>
</body>
