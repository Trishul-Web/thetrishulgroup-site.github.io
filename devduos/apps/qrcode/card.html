<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Link Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: linear-gradient(160deg, #EFF6FF, #FFFFFF);
            --card: #FFFFFF;
            --text: #111827;
            --sub: #6B7280;
            --btn: #FFFFFF;
            --btnText: #111827;
            --border: #E5E7EB;
            --accent: #2563EB;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 18px calc(30px + env(safe-area-inset-bottom));
        }

        .wrap {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            color: #fff;
            background: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
            border: 4px solid #fff;
            position: relative;
        }

        .avatar.small {
            width: 72px;
            height: 72px;
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .bio {
            color: var(--sub);
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
            word-break: break-word;
        }

        /* STACK (default) */
        .links {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 18px;
            border-radius: 16px;
            background: var(--btn);
            color: var(--btnText);
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .06);
            transition: transform .15s;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }

        .btn:active,
        .tile:active,
        .chip:active,
        .ic:active {
            transform: scale(.97);
        }

        .ico {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(127, 127, 127, .14);
            flex-shrink: 0;
        }

        .lbl {
            flex: 1;
            text-align: left;
            overflow: hidden;
        }

        .lbl small {
            display: block;
            font-size: 11px;
            font-weight: 600;
            opacity: .6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PILL */
        .pill {
            justify-content: center;
            border-radius: 999px;
        }

        .pill .lbl {
            flex: none;
            text-align: center;
        }

        /* GLASS */
        .glassb {
            background: rgba(255, 255, 255, .16) !important;
            color: var(--text) !important;
            border: 1px solid rgba(255, 255, 255, .35) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: none !important;
        }

        /* NEON */
        body.neon {
            background: linear-gradient(160deg, #05070F, #111827) !important;
            color: #fff;
        }

        body.neon .bio,
        body.neon .footer a {
            color: #94A3B8;
        }

        body.neon .avatar {
            border-color: var(--accent);
            box-shadow: 0 0 26px var(--accent);
        }

        .neonb {
            background: transparent !important;
            color: var(--accent) !important;
            border: 1.5px solid var(--accent) !important;
            box-shadow: 0 0 14px var(--accent) !important;
        }

        /* RETRO */
        .retrob {
            background: #fff !important;
            color: #111 !important;
            border: 2.5px solid #111 !important;
            border-radius: 6px !important;
            box-shadow: 5px 5px 0 #111 !important;
        }

        /* MINIMAL */
        .mlinks {
            margin-top: 26px;
            display: flex;
            flex-direction: column;
        }

        .mlink {
            padding: 15px 4px;
            border-bottom: 1px solid rgba(127, 127, 127, .3);
            color: var(--text);
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .mlink small {
            font-weight: 600;
            font-size: 12px;
            color: var(--sub);
            max-width: 50%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* GRID + BENTO */
        .grid {
            margin-top: 26px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tile {
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 18px 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
            text-align: center;
            word-break: break-word;
            min-height: 104px;
            transition: transform .15s;
        }

        .tile .big {
            font-size: 30px;
        }

        .tile.hero {
            grid-column: 1 / -1;
            background: var(--accent);
            color: #fff;
            border: none;
            flex-direction: row;
            font-size: 17px;
            min-height: 76px;
        }

        .tile.hero .big {
            font-size: 24px;
        }

        /* COVER */
        .coverband {
            height: 130px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), rgba(0, 0, 0, .25));
            margin-bottom: -52px;
        }

        /* ICON BUBBLES */
        .icons {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px 14px;
        }

        .ic {
            width: 76px;
            text-decoration: none;
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            word-break: break-word;
            transition: transform .15s;
        }

        .ic .c {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
        }

        /* BUSINESS CARD */
        .biz {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 12px 34px rgba(0, 0, 0, .14);
        }

        .biz .avatar {
            width: 68px;
            height: 68px;
            font-size: 28px;
            margin: 0;
            flex-shrink: 0;
        }

        .biz h1 {
            font-size: 20px;
        }

        .biz .bio {
            color: inherit;
            opacity: .7;
        }

        .chips {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .chip {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 11px 16px;
            border-radius: 999px;
            background: var(--btn);
            color: var(--btnText);
            border: 1.5px solid var(--border);
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
            transition: transform .15s;
        }

        .save {
            margin-top: 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            justify-content: center;
        }

        .footer {
            margin-top: 34px;
            font-size: 12px;
            font-weight: 700;
        }

        .footer a {
            color: var(--sub);
            text-decoration: none;
        }

        .err {
            margin-top: 30vh;
            color: var(--sub);
            font-weight: 700;
        }

        /* PREVIEW MODE */
        .pbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99;
            background: #F59E0B;
            color: #111;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            padding: 10px 12px calc(10px);
            padding-top: calc(10px + env(safe-area-inset-top));
            box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
            letter-spacing: .3px;
        }

        body.preview {
            padding-top: 84px;
        }

        body.preview a,
        body.preview button {
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="wrap" id="app"></div>

    <script>
        var FOOTER_URL = "https://play.google.com/store/search?q=DevDuo%20QR%20Code&c=apps";
        var LAYOUTS = ["stack", "minimal", "grid", "cover", "pill", "glass", "bento", "neon", "retro", "iconbar", "card"];

        var THEMES = {
            classic: { bg: "linear-gradient(160deg,#EFF6FF,#FFFFFF)", card: "#FFFFFF", text: "#111827", sub: "#6B7280", btn: "#FFFFFF", btnText: "#111827", border: "#E5E7EB", accent: "#2563EB" },
            midnight: { bg: "linear-gradient(160deg,#020617,#0F172A)", card: "#0F172A", text: "#F8FAFC", sub: "#94A3B8", btn: "#1E293B", btnText: "#F8FAFC", border: "#334155", accent: "#38BDF8" },
            sunset: { bg: "linear-gradient(160deg,#F97316,#DB2777)", card: "#FFFFFF", text: "#FFFFFF", sub: "#FFE4E6", btn: "rgba(255,255,255,.95)", btnText: "#9D174D", border: "transparent", accent: "#BE185D" },
            ocean: { bg: "linear-gradient(160deg,#0EA5E9,#1E3A8A)", card: "#FFFFFF", text: "#FFFFFF", sub: "#DBEAFE", btn: "rgba(255,255,255,.95)", btnText: "#1E3A8A", border: "transparent", accent: "#1D4ED8" },
            forest: { bg: "linear-gradient(160deg,#10B981,#064E3B)", card: "#FFFFFF", text: "#FFFFFF", sub: "#D1FAE5", btn: "rgba(255,255,255,.95)", btnText: "#064E3B", border: "transparent", accent: "#047857" },
            royal: { bg: "linear-gradient(160deg,#4C1D95,#6D28D9)", card: "#FDE68A", text: "#FFFFFF", sub: "#DDD6FE", btn: "#1E1B4B", btnText: "#FDE68A", border: "#F59E0B", accent: "#F59E0B" }
        };

        var TYPES = {
            instagram: { label: "Instagram", icon: "📸" }, whatsapp: { label: "WhatsApp", icon: "💬" },
            website: { label: "Website", icon: "🌐" }, phone: { label: "Call", icon: "📞" },
            email: { label: "Email", icon: "✉️" }, upi: { label: "Pay via UPI", icon: "₹" },
            youtube: { label: "YouTube", icon: "▶️" }, facebook: { label: "Facebook", icon: "👍" },
            linkedin: { label: "LinkedIn", icon: "💼" }, x: { label: "X / Twitter", icon: "✖️" },
            telegram: { label: "Telegram", icon: "✈️" }
        };

        function decode(s) {
            s = s.replace(/-/g, "+").replace(/_/g, "/");
            while (s.length % 4) s += "=";
            var bin = atob(s);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return JSON.parse(new TextDecoder().decode(bytes));
        }

        function handle(v) { return v.replace(/^@/, "").replace(/\s+/g, ""); }
        function isHttp(v) { return /^https?:\/\//i.test(v); }

        function buildUrl(type, v, name) {
            v = String(v || "").trim();
            if (!v) return null;
            switch (type) {
                case "instagram": return isHttp(v) ? v : "https://instagram.com/" + handle(v);
                case "whatsapp": return "https://wa.me/" + v.replace(/[^0-9]/g, "");
                case "website": return isHttp(v) ? v : "https://" + v;
                case "phone": return "tel:" + v.replace(/[^0-9+]/g, "");
                case "email": return "mailto:" + v;
                case "upi": return "upi://pay?pa=" + encodeURIComponent(v) + "&pn=" + encodeURIComponent(name) + "&cu=INR";
                case "youtube": return isHttp(v) ? v : "https://youtube.com/@" + handle(v);
                case "facebook": return isHttp(v) ? v : "https://facebook.com/" + handle(v);
                case "linkedin": return isHttp(v) ? v : "https://linkedin.com/in/" + handle(v);
                case "x": return isHttp(v) ? v : "https://x.com/" + handle(v);
                case "telegram": return isHttp(v) ? v : "https://t.me/" + handle(v);
                default: return isHttp(v) ? v : null;
            }
        }

        function safe(url) { return url && /^(https?:|tel:|mailto:|upi:)/i.test(url); }

        function applyTheme(t) {
            var th = THEMES[t] || THEMES.classic;
            var r = document.documentElement.style;
            Object.keys(th).forEach(function (k) { r.setProperty("--" + k, th[k]); });
        }

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }

        function link(url, cls) {
            var a = el("a", cls);
            a.href = url;
            if (/^https?:/i.test(url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
            return a;
        }

        function saveContact(name, phone, email) {
            var vcf = "BEGIN:VCARD\nVERSION:3.0\nFN:" + name + (phone ? "\nTEL:" + phone : "") + (email ? "\nEMAIL:" + email : "") + "\nEND:VCARD";
            var blob = new Blob([vcf], { type: "text/vcard" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = (name || "contact").replace(/[^a-z0-9]/gi, "_") + ".vcf";
            document.body.appendChild(a); a.click(); a.remove();
        }

        function renderHeader(app, layout, name, bio) {
            var initial = name.trim().charAt(0).toUpperCase();
            if (layout === "card") {
                var biz = el("div", "biz");
                biz.appendChild(el("div", "avatar", initial));
                var col = el("div");
                col.appendChild(el("h1", null, name));
                if (bio) col.appendChild(el("p", "bio", bio));
                biz.appendChild(col);
                app.appendChild(biz);
                return;
            }
            if (layout === "cover") app.appendChild(el("div", "coverband"));
            app.appendChild(el("div", layout === "minimal" ? "avatar small" : "avatar", initial));
            app.appendChild(el("h1", null, name));
            if (bio) app.appendChild(el("p", "bio", bio));
        }

        function btn(it, extra, noSub) {
            var a = link(it.url, "btn" + (extra ? " " + extra : ""));
            a.appendChild(el("span", "ico", it.icon));
            var lbl = el("span", "lbl", it.label);
            if (!noSub) lbl.appendChild(el("small", null, it.val));
            a.appendChild(lbl);
            if (!noSub) a.appendChild(el("span", null, "›"));
            return a;
        }

        function tile(it, hero) {
            var a = link(it.url, hero ? "tile hero" : "tile");
            a.appendChild(el("span", "big", it.icon));
            a.appendChild(el("span", null, it.label));
            return a;
        }

        function renderLinks(app, layout, items) {
            var box;
            switch (layout) {
                case "minimal":
                    box = el("div", "mlinks");
                    items.forEach(function (it) {
                        var a = link(it.url, "mlink");
                        a.appendChild(el("span", null, it.label));
                        a.appendChild(el("small", null, it.val));
                        box.appendChild(a);
                    });
                    break;
                case "grid":
                    box = el("div", "grid");
                    items.forEach(function (it) { box.appendChild(tile(it, false)); });
                    break;
                case "bento":
                    box = el("div", "grid");
                    items.forEach(function (it, i) { box.appendChild(tile(it, i === 0)); });
                    break;
                case "iconbar":
                    box = el("div", "icons");
                    items.forEach(function (it) {
                        var a = link(it.url, "ic");
                        a.appendChild(el("span", "c", it.icon));
                        a.appendChild(el("span", null, it.label));
                        box.appendChild(a);
                    });
                    break;
                case "card":
                    box = el("div", "chips");
                    items.forEach(function (it) {
                        var a = link(it.url, "chip");
                        a.appendChild(el("span", null, it.icon));
                        a.appendChild(el("span", null, it.label));
                        box.appendChild(a);
                    });
                    break;
                case "pill":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "pill", true)); });
                    break;
                case "glass":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "glassb")); });
                    break;
                case "neon":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "neonb")); });
                    break;
                case "retro":
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it, "retrob")); });
                    break;
                default:
                    box = el("div", "links");
                    items.forEach(function (it) { box.appendChild(btn(it)); });
            }
            app.appendChild(box);
        }

        (function render() {
            var app = document.getElementById("app");
            try {
                var m = (location.hash || "").match(/d=([A-Za-z0-9\-_]+)/);
                if (!m) throw new Error("no data");
                var d = decode(m[1]);

                applyTheme(d.t);
                var layout = LAYOUTS.indexOf(d.y) >= 0 ? d.y : "stack";
                if (layout === "neon") document.body.classList.add("neon");

                if (d.p === 1) {
                    document.body.classList.add("preview");
                    document.body.appendChild(el("div", "pbar", "👀 PREVIEW MODE · Design preview only, links are disabled"));
                }

                var name = String(d.n || "My Links").slice(0, 40);
                var bio = d.b ? String(d.b).slice(0, 60) : "";
                document.title = name;

                renderHeader(app, layout, name, bio);

                var items = [];
                var phone = "", email = "";
                (d.l || []).slice(0, 8).forEach(function (pair) {
                    var type = pair[0], val = String(pair[1] || "");
                    if (type === "phone" || (type === "whatsapp" && !phone)) phone = val;
                    if (type === "email") email = val;
                    var url = buildUrl(type, val, name);
                    if (!safe(url)) return;
                    var info = TYPES[type] || TYPES.website;
                    var customTitle = pair[2] ? String(pair[2]).trim().slice(0, 30) : "";
                    items.push({ url: url, icon: info.icon, label: customTitle || info.label, val: val });
                });

                renderLinks(app, layout, items);

                if (phone || email) {
                    var sb = el("button", "btn save", "⬇ Save Contact");
                    sb.onclick = function () { saveContact(name, phone, email); };
                    app.appendChild(sb);
                }

                if (d.f !== 0) {
                    var f = el("div", "footer");
                    var fa = el("a", null, "⚡ Made with DevDuo QR · Create yours free");
                    fa.href = FOOTER_URL; fa.target = "_blank"; fa.rel = "noopener";
                    f.appendChild(fa);
                    app.appendChild(f);
                }
            } catch (e) {
                app.appendChild(el("p", "err", "This card link is invalid or incomplete."));
            }
        })();
    </script>
</body>

</html>
